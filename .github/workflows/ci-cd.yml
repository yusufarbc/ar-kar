name: CI/CD Pipeline

on:
  push:
    branches:
      - production
      - staging
  pull_request:
    branches:
      - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------
  # Zorunlu kapı: tip kontrolü + build. Başarısız olursa deploy çalışmaz.
  # --------------------------------------------------------------------
  test:
    name: Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Gate (astro check && astro build)
        run: npm run test

      - name: Type-check Panel Functions
        run: npx tsc -p tsconfig.panel.json

      - name: Verify Build Output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html üretilmedi"; exit 1; }
          test -f dist/sitemap.xml || { echo "::error::dist/sitemap.xml üretilmedi"; exit 1; }
          echo "Build çıktısı doğrulandı."

  # --------------------------------------------------------------------
  # Ana site (statik) -> Cloudflare Pages: ar-kar
  # ar-kar.com + www.ar-kar.com
  # --------------------------------------------------------------------
  deploy-site:
    name: Deploy Site (Cloudflare Pages)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=ar-kar
            --branch=${{ github.ref_name }}

  # --------------------------------------------------------------------
  # Yönetim paneli -> Cloudflare Pages: ar-kar-admin
  # panel.ar-kar.com (Cloudflare Access ile korunur)
  #
  # Yalnızca panel/ dizini değiştiğinde deploy edilir.
  # --------------------------------------------------------------------
  deploy-panel:
    name: Deploy Panel (Cloudflare Pages)
    needs: test
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Panel değişti mi?
        id: changed
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^panel/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "panel/ değişmedi, deploy atlanıyor."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.changed.outputs.run == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # functions/ dizini çalışma dizinine göre aranır; bu yüzden
          # workingDirectory panel/ olmalı ve statik klasör public/ verilmeli.
          workingDirectory: panel
          command: >-
            pages deploy public
            --project-name=ar-kar-admin
            --branch=production
