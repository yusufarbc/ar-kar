name: CI/CD Pipeline

on:
  push:
    branches:
      - production
      - staging
  pull_request:
    branches:
      - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------
  # Push kapsamını güvenli biçimde sınıflandırır. Yalnızca commit mesajına
  # güvenilmez: CMS modu için değişen TÜM dosyaların içerik/görsel dizinleri
  # içinde kalması da zorunludur. Böylece `cms:` diye etiketlenmiş bir kod
  # değişikliği kalite kapısını atlayamaz.
  # --------------------------------------------------------------------
  classify:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.changes.outputs.mode }}
      panel_changed: ${{ steps.changes.outputs.panel_changed }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify push
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          mode="code"
          panel_changed="false"

          if [ "$EVENT_NAME" = "push" ]; then
            BASE="$BEFORE_SHA"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD^"
            fi

            changed_files="$(git diff --name-only "$BASE" HEAD)"
            content_only="true"

            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                src/content/*|public/img/*) ;;
                *) content_only="false" ;;
              esac
              case "$file" in
                panel/*) panel_changed="true" ;;
              esac
            done <<EOF
          $changed_files
          EOF

            if [ "$content_only" = "true" ] && [ -n "$changed_files" ]; then
              case "$HEAD_MESSAGE" in
                cms:*) mode="cms" ;;
                media:*) mode="media" ;;
              esac
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "panel_changed=$panel_changed" >> "$GITHUB_OUTPUT"
          echo "Değişiklik modu: $mode; panel değişti: $panel_changed"

  # --------------------------------------------------------------------
  # Kod değişikliklerinde zorunlu kapı: tip kontrolü + build.
  # Panelin oluşturduğu `cms:` ve ara `media:` commitleri kontrollü içerik
  # değişiklikleridir; bunlarda tam kalite kapısı gereksiz yere aynı siteyi
  # iki kez derlediği için atlanır.
  # --------------------------------------------------------------------
  test:
    name: Test & Quality Gate
    needs: classify
    if: github.event_name != 'push' || needs.classify.outputs.mode == 'code'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Gate (astro check && astro build)
        run: npm run test

      - name: Type-check Panel Functions
        run: npx tsc -p tsconfig.panel.json

      - name: Verify Build Output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html üretilmedi"; exit 1; }
          test -f dist/sitemap.xml || { echo "::error::dist/sitemap.xml üretilmedi"; exit 1; }
          echo "Build çıktısı doğrulandı."

  # --------------------------------------------------------------------
  # Ana site (statik) -> Cloudflare Pages: ar-kar
  # ar-kar.com + www.ar-kar.com
  # --------------------------------------------------------------------
  deploy-site:
    name: Deploy Site (Cloudflare Pages)
    needs: [classify, test]
    # `always()` gereklidir: cms commitinde `test` bilinçli olarak skipped
    # olsa da deploy çalışmalıdır. `media:` commitleri panel yayın işleminin
    # ara adımlarıdır; son `cms:` commitinin deploy'u tüm dosyaları kapsar.
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.mode != 'media' &&
      (needs.classify.outputs.mode == 'cms' ||
       (needs.classify.outputs.mode == 'code' && needs.test.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # staging dalı canlı sitenin önizleme kopyasıdır: noindex meta'sı,
      # "Disallow: /" robots.txt'si ve kendi canonical adresiyle derlenir
      # (bkz. astro.config.mjs). production dalı normal derlenir.
      - name: Build
        env:
          PUBLIC_DEPLOY_ENV: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
        run: npm run build

      # cloudflare/wrangler-action kendi wrangler sürümünü kurar ve bu,
      # repodaki @cloudflare/workers-types ile peer çakışması yaratıyor.
      # Bu yüzden doğrudan projenin kendi wrangler'ı kullanılıyor.
      #
      # --skip-caching: Cloudflare'in POST /pages/assets/check-missing
      # uç noktası 2026-09-18'de kalıcı 500 hatası vermeye başladı
      # (Cloudflare tarafında "Minor Service Outage", 4 farklı Ray ID ile
      # doğrulandı). Bu bayrak dosya-hash önbelleğini atlayıp her seferinde
      # tüm dosyaları yeniden yükler; check-missing çağrısını devre dışı
      # bırakarak sorunu aşar. Proje küçük olduğu için (143 dosya, ~5sn)
      # performans kaybı önemsiz.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name=ar-kar --branch="${{ github.ref_name }}" --commit-dirty=true --skip-caching

  # --------------------------------------------------------------------
  # Yönetim paneli -> Cloudflare Pages: ar-kar-admin
  # panel.ar-kar.com (Cloudflare Access ile korunur)
  #
  # Yalnızca panel/ dizini değiştiğinde deploy edilir.
  # --------------------------------------------------------------------
  deploy-panel:
    name: Deploy Panel (Cloudflare Pages)
    needs: [classify, test]
    if: >-
      always() &&
      github.ref == 'refs/heads/production' &&
      github.event_name == 'push' &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.mode == 'code' &&
      needs.classify.outputs.panel_changed == 'true' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # functions/ dizini ÇALIŞMA DİZİNİNE göre aranır; bu yüzden panel/
      # içinden çalıştırılır ve statik klasör olarak public/ verilir.
      - name: Deploy to Cloudflare Pages
        working-directory: panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy public --project-name=ar-kar-admin --branch=production --commit-dirty=true
