name: CI/CD Pipeline

on:
  push:
    branches:
      - production
      - staging
  pull_request:
    branches:
      - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------
  # Zorunlu kapı: tip kontrolü + build. Başarısız olursa deploy çalışmaz.
  # --------------------------------------------------------------------
  test:
    name: Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Gate (astro check && astro build)
        run: npm run test

      - name: Type-check Panel Functions
        run: npx tsc -p tsconfig.panel.json

      - name: Verify Build Output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html üretilmedi"; exit 1; }
          test -f dist/sitemap.xml || { echo "::error::dist/sitemap.xml üretilmedi"; exit 1; }
          echo "Build çıktısı doğrulandı."

  # --------------------------------------------------------------------
  # Ana site (statik) -> Cloudflare Pages: ar-kar
  # ar-kar.com + www.ar-kar.com
  # --------------------------------------------------------------------
  deploy-site:
    name: Deploy Site (Cloudflare Pages)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # staging dalı canlı sitenin önizleme kopyasıdır: noindex meta'sı,
      # "Disallow: /" robots.txt'si ve kendi canonical adresiyle derlenir
      # (bkz. astro.config.mjs). production dalı normal derlenir.
      - name: Build
        env:
          PUBLIC_DEPLOY_ENV: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
        run: npm run build

      # cloudflare/wrangler-action kendi wrangler sürümünü kurar ve bu,
      # repodaki @cloudflare/workers-types ile peer çakışması yaratıyor.
      # Bu yüzden doğrudan projenin kendi wrangler'ı kullanılıyor.
      #
      # --skip-caching: Cloudflare'in POST /pages/assets/check-missing
      # uç noktası 2026-09-18'de kalıcı 500 hatası vermeye başladı
      # (Cloudflare tarafında "Minor Service Outage", 4 farklı Ray ID ile
      # doğrulandı). Bu bayrak dosya-hash önbelleğini atlayıp her seferinde
      # tüm dosyaları yeniden yükler; check-missing çağrısını devre dışı
      # bırakarak sorunu aşar. Proje küçük olduğu için (143 dosya, ~5sn)
      # performans kaybı önemsiz.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name=ar-kar --branch="${{ github.ref_name }}" --commit-dirty=true --skip-caching

  # --------------------------------------------------------------------
  # Yönetim paneli -> Cloudflare Pages: ar-kar-admin
  # panel.ar-kar.com (Cloudflare Access ile korunur)
  #
  # Yalnızca panel/ dizini değiştiğinde deploy edilir.
  # --------------------------------------------------------------------
  deploy-panel:
    name: Deploy Panel (Cloudflare Pages)
    needs: test
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # github.event.before'a kadar diff alabilmek için tam geçmiş
          # gerekir; bir push birden fazla commit taşıyorsa 2 yeterli değil.
          fetch-depth: 0

      - name: Panel değişti mi?
        id: changed
        run: |
          # NOT: HEAD^..HEAD yalnızca SON commit'i kontrol eder. Bir push
          # birden fazla commit taşıdığında (ör. bu depo topluca birkaç
          # commit'le güncellendiğinde) panel/ değişikliği önceki bir
          # commit'te kalabilir ve HEAD^..HEAD onu göremez — deploy
          # sessizce atlanır. github.event.before, push'tan ÖNCEKİ SHA'dır
          # ve tüm push aralığını kapsar; ilk push (before all-zero SHA)
          # durumunda HEAD^'e düşer.
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD^"
          fi
          if git diff --name-only "$BASE" HEAD | grep -q '^panel/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "panel/ değişmedi, deploy atlanıyor."
          fi

      - name: Setup Node.js
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        if: steps.changed.outputs.run == 'true'
        run: npm ci

      # functions/ dizini ÇALIŞMA DİZİNİNE göre aranır; bu yüzden panel/
      # içinden çalıştırılır ve statik klasör olarak public/ verilir.
      - name: Deploy to Cloudflare Pages
        if: steps.changed.outputs.run == 'true'
        working-directory: panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy public --project-name=ar-kar-admin --branch=production --commit-dirty=true
