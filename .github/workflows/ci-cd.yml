name: CI/CD Pipeline

on:
  push:
    branches:
      - production
      - staging
  pull_request:
    branches:
      - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------
  # Zorunlu kapı: tip kontrolü + build. Başarısız olursa deploy çalışmaz.
  # --------------------------------------------------------------------
  test:
    name: Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Gate (astro check && astro build)
        run: npm run test

      - name: Verify Build Output
        run: |
          test -f dist/server/entry.mjs || { echo "::error::dist/server/entry.mjs üretilmedi"; exit 1; }
          test -f dist/client/index.html || { echo "::error::dist/client/index.html üretilmedi"; exit 1; }
          echo "Build çıktısı doğrulandı."

  # --------------------------------------------------------------------
  # Staging: ar-kar-staging worker'ına deploy (canlıya dokunmaz)
  # --------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Cloudflare Workers (Staging)
    needs: test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # NOT: wrangler `env` blokları adapter çıktısına aktarılmadığı için
          # `--env staging` production'ın üzerine yazar. Ayrım worker adı ile yapılır.
          command: deploy --name ar-kar-staging

  # --------------------------------------------------------------------
  # Production: ar-kar worker'ına deploy (ar-kar.com + panel.ar-kar.com)
  # --------------------------------------------------------------------
  deploy-production:
    name: Deploy to Cloudflare Workers (Production)
    needs: test
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name ar-kar
