<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#15171c" />
  <title>AR-KAR İçerik Paneli</title>
  <link rel="stylesheet" href="/css/panel.css" />
</head>
<body data-view="list">

  <header class="topbar">
    <span class="topbar__brand"><span class="topbar__dot"></span>AR-KAR İçerik Paneli</span>
    <span class="topbar__spacer"></span>
    <span class="topbar__who" id="who" title="Cloudflare Access kimliği"></span>
    <a class="topbar__link" href="https://ar-kar.com" target="_blank" rel="noopener">Siteyi aç ↗</a>
  </header>

  <main class="shell">

    <!-- ---------------- Kenar çubuğu: kayıt listesi ---------------- -->
    <aside class="panel side">
      <div class="side__head">
        <div class="tabs" id="tabs" role="tablist"></div>
        <div class="search">
          <input type="text" id="search" placeholder="Kayıtlarda ara…" autocomplete="off" aria-label="Kayıtlarda ara" />
        </div>
        <button type="button" class="side__new" id="newBtn">＋ Yeni kayıt</button>
      </div>
      <div class="bulkbar" id="bulkBar">
        <span class="bulkbar__count" id="bulkCount"></span>
        <button type="button" class="btn-ghost" id="bulkClearBtn">Seçimi temizle</button>
        <button type="button" class="btn-danger" id="bulkDeleteBtn">Seçilenleri sil</button>
      </div>
      <div class="side__count" id="count"></div>
      <ul class="entries" id="entries"></ul>
      <div class="side__empty" id="sideEmpty" hidden></div>
    </aside>

    <!-- ---------------- Düzenleyici ---------------- -->
    <section class="panel editor">
      <div class="editor__head">
        <button type="button" class="editor__back" id="backBtn">← Kayıtlar</button>
        <div class="editor__titles">
          <span class="badge" id="modeBadge"></span>
          <h1 class="editor__name" id="editorName">Yeni kayıt</h1>
          <div class="editor__url" id="editorUrl"></div>
        </div>
        <div class="editor__actions">
          <button type="button" class="btn-danger" id="deleteBtn" hidden>Sil</button>
          <button type="button" class="btn-ghost" id="cancelBtn">Vazgeç</button>
          <button type="button" class="btn-primary" id="saveBtn">Yayınla</button>
        </div>
      </div>

      <div class="editor__body">
        <form id="form" novalidate>
          <div id="fields"></div>
        </form>
      </div>
    </section>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <dialog id="confirmDlg">
    <div class="dlg__body">
      <h2 class="dlg__title" id="dlgTitle">Emin misiniz?</h2>
      <p class="dlg__text" id="dlgText"></p>
    </div>
    <div class="dlg__actions">
      <button type="button" class="btn-ghost" id="dlgCancel">Vazgeç</button>
      <button type="button" class="btn-danger" id="dlgOk">Evet</button>
    </div>
  </dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
