<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>AR-KAR İçerik Paneli</title>
  <style>
    :root{
      --bg:#f4f5f7; --card:#fff; --ink:#15171c; --muted:#6b7280;
      --line:#e3e5ea; --brand:#cc272b; --ok:#15734a; --danger:#b42318;
      color-scheme: light;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
    }
    header{
      background:#15171c; color:#fff; position:sticky; top:0; z-index:20;
      padding:calc(13px + env(safe-area-inset-top,0px)) 16px 13px;
      display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    }
    header h1{font-size:.98rem;margin:0;font-weight:700;letter-spacing:.02em}
    header .who{margin-left:auto;font-size:.78rem;color:#9aa1ac}
    .wrap{max-width:820px;margin:0 auto;padding:16px}
    .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .tab{
      border:1px solid var(--line); background:var(--card); color:var(--ink);
      padding:9px 16px;border-radius:999px;cursor:pointer;font:inherit;font-weight:600;font-size:.9rem;
    }
    .tab[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
    .card h2{margin:0 0 12px;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
    label{display:block;font-weight:600;font-size:.85rem;margin:0 0 6px}
    input[type=text],input[type=date],textarea,select,input[type=file]{
      width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
      font:inherit;background:#fff;color:var(--ink)
    }
    textarea{resize:vertical}
    .field{margin-bottom:14px}
    .hint{font-size:.78rem;color:var(--muted);margin-top:5px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    button{font:inherit;font-weight:600;border-radius:8px;padding:10px 18px;border:1px solid transparent;cursor:pointer}
    .primary{background:var(--brand);color:#fff}
    .ghost{background:#fff;border-color:var(--line);color:var(--ink)}
    .danger{background:#fff;border-color:#f2c4c0;color:var(--danger)}
    button:disabled{opacity:.55;cursor:not-allowed}
    ul.entries{list-style:none;margin:0;padding:0}
    ul.entries li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line)}
    ul.entries li:last-child{border-bottom:0}
    .entry-main{flex:1 1 220px;min-width:0}
    .entry-title{font-weight:600}
    .entry-meta{font-size:.78rem;color:var(--muted)}
    .msg{padding:11px 14px;border-radius:8px;margin-bottom:14px;font-size:.9rem;display:none}
    .msg.ok{display:block;background:#e6f5ee;color:var(--ok);border:1px solid #bde2cf}
    .msg.err{display:block;background:#fdeceb;color:var(--danger);border:1px solid #f4c8c4}
    .empty{color:var(--muted);font-size:.9rem;padding:10px 0}
    img.preview{max-width:200px;border-radius:8px;margin-top:8px;display:block}

    /* --- Markdown editör --- */
    .md-toolbar{
      display:flex;flex-wrap:wrap;gap:4px;background:#f4f5f7;border:1px solid var(--line);
      border-bottom:0;border-radius:8px 8px 0 0;padding:6px;
    }
    .md-toolbar button{
      padding:6px 10px;font-size:.82rem;font-weight:600;background:#fff;
      border:1px solid var(--line);border-radius:6px;color:var(--ink);line-height:1;
    }
    .md-toolbar button:hover{background:#eee}
    .md-toolbar .sep{width:1px;background:var(--line);margin:2px 2px}
    .md-toolbar .push{margin-left:auto}
    .md-toolbar button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
    .md-wrap textarea{border-radius:0 0 8px 8px;border-top:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88rem}
    .md-preview{
      display:none;border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;
      padding:14px;background:#fff;min-height:120px;font-size:.92rem;line-height:1.6;
    }
    .md-preview.active{display:block}
    .md-preview h2,.md-preview h3{margin:.6em 0 .3em}
    .md-preview p{margin:0 0 .8em}
    .md-preview ul,.md-preview ol{margin:0 0 .8em;padding-left:1.4em}
    .md-preview img{max-width:100%;border-radius:6px}
    .md-editor-area[hidden]{display:none}

    /* --- Galeri --- */
    .gallery-thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
    .gallery-thumb{position:relative;width:88px;height:88px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
    .gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .gallery-thumb button{
      position:absolute;top:2px;right:2px;width:22px;height:22px;padding:0;
      border-radius:50%;background:rgba(20,20,20,.72);color:#fff;font-size:.85rem;line-height:1;border:0;
    }
    .gallery-thumb.is-new::after{
      content:"yeni";position:absolute;left:0;bottom:0;right:0;background:rgba(21,115,74,.85);
      color:#fff;font-size:.65rem;text-align:center;padding:1px 0;
    }

    @media (max-width:480px){
      .wrap{padding:12px}
      button{width:100%}
      .row button{width:auto;flex:1 1 auto}
      .md-toolbar button{width:auto}
      .gallery-thumb{width:72px;height:72px}
    }
  </style>
</head>
<body>
  <header>
    <h1>AR-KAR İçerik Paneli</h1>
    <span class="who" id="who"></span>
  </header>

  <div class="wrap">
    <div class="msg" id="msg"></div>
    <div class="tabs" id="tabs" role="tablist"></div>

    <div class="card">
      <h2 id="listTitle">Kayıtlar</h2>
      <ul class="entries" id="entries"></ul>
      <div class="empty" id="listEmpty">Yükleniyor…</div>
    </div>

    <div class="card">
      <h2 id="formTitle">Yeni Kayıt</h2>
      <form id="form" novalidate>
        <div id="fields"></div>
        <div class="row">
          <button type="submit" class="primary" id="saveBtn">Yayınla</button>
          <button type="button" class="ghost" id="resetBtn">Temizle</button>
        </div>
        <div class="hint">
          Kaydettiğinizde içerik <code>production</code> dalına commit edilir,
          testler geçtikten sonra site otomatik güncellenir (1-2 dakika).
          Görseller yüklenirken otomatik olarak WebP'ye çevrilir.
        </div>
      </form>
    </div>
  </div>

<script>
const COLLECTIONS = {
  blog: {
    label: 'Haberler',
    fields: [
      {name:'title',       label:'Başlık',          type:'text',     required:true},
      {name:'date',        label:'Tarih',           type:'date',     required:true},
      {name:'description', label:'Özet Açıklama',   type:'textarea'},
      {name:'coverImage',  label:'Kapak Görseli',   type:'image'},
      {name:'gallery',     label:'Ek Görseller (Galeri)', type:'gallery'},
      {name:'content',     label:'İçerik', type:'markdown', required:true},
    ],
  },
  projects: {
    label: 'Projeler',
    fields: [
      {name:'title',    label:'Proje Adı', type:'text', required:true},
      {name:'category', label:'Kategori',  type:'select', required:true, options:[
        {value:'insaat',     label:'İnşaat'},
        {value:'pvc',        label:'PVC & Alüminyum'},
        {value:'mimar',      label:'Mimarlık'},
      ]},
      {name:'location',    label:'Konum',            type:'text', placeholder:'Çarşamba, Samsun'},
      {name:'specs',       label:'Daire / Teknik Bilgi', type:'text', placeholder:'18 Daire (8x2+1, 10x1+1)'},
      {name:'date',        label:'Tarih',            type:'date', required:true},
      {name:'description', label:'Kısa Açıklama',    type:'textarea'},
      {name:'coverImage',  label:'Proje Görseli',    type:'image'},
      {name:'gallery',     label:'Ek Görseller (Galeri)', type:'gallery'},
      {name:'content',     label:'Detaylı Bilgi', type:'markdown', required:true},
    ],
  },
};

const keys = Object.keys(COLLECTIONS);
let current = keys[0];
let editingSlug = null;
let pendingImage = null;      // {base64, name} — kapak görseli
let galleryState = { existing: [], newFiles: [] }; // existing: string[] yollar, newFiles: {base64,name}[]

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const today = () => new Date().toISOString().slice(0,10);

function showMsg(text, kind){
  const m = $('msg');
  m.textContent = text;
  m.className = 'msg ' + kind;
  if (kind === 'ok') setTimeout(() => { m.className = 'msg'; }, 7000);
}

/** Görseli tarayıcıda WebP'ye çevirir; büyük görselleri 1600px'e küçültür. */
async function toWebp(file, maxWidth = 1600, quality = 0.82){
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, maxWidth / bitmap.width);
  const w = Math.round(bitmap.width * scale);
  const h = Math.round(bitmap.height * scale);

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);

  const blob = await new Promise((res) => canvas.toBlob(res, 'image/webp', quality));
  if (!blob) throw new Error('Görsel WebP formatına çevrilemedi.');

  const dataUrl = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
  return { dataUrl, width: w, height: h, size: blob.size };
}

/* ------------------------------------------------------------------------
   Küçük Markdown -> HTML dönüştürücü (yalnızca panel önizlemesi için).
   Sitedeki gerçek render Astro/Markdoc üzerinden yapılır; bu yalnızca
   editörde hızlı bir fikir vermek amaçlıdır, tam uyum garanti etmez.
   ------------------------------------------------------------------------ */
function mdToHtml(src){
  const escHtml = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = escHtml(src).split(/\r?\n/);
  let html = '';
  let inList = null; // 'ul' | 'ol' | null
  const closeList = () => { if (inList) { html += `</${inList}>`; inList = null; } };

  const inline = (t) => t
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  for (const raw of lines){
    const line = raw;
    if (/^\s*$/.test(line)) { closeList(); continue; }
    let m;
    if ((m = line.match(/^###\s+(.*)$/))) { closeList(); html += `<h4>${inline(m[1])}</h4>`; continue; }
    if ((m = line.match(/^##\s+(.*)$/)))  { closeList(); html += `<h3>${inline(m[1])}</h3>`; continue; }
    if ((m = line.match(/^#\s+(.*)$/)))   { closeList(); html += `<h2>${inline(m[1])}</h2>`; continue; }
    if ((m = line.match(/^[-*]\s+(.*)$/))) {
      if (inList !== 'ul') { closeList(); html += '<ul>'; inList = 'ul'; }
      html += `<li>${inline(m[1])}</li>`; continue;
    }
    if ((m = line.match(/^\d+\.\s+(.*)$/))) {
      if (inList !== 'ol') { closeList(); html += '<ol>'; inList = 'ol'; }
      html += `<li>${inline(m[1])}</li>`; continue;
    }
    closeList();
    html += `<p>${inline(line)}</p>`;
  }
  closeList();
  return html || '<p style="color:#9aa1ac">Önizlenecek içerik yok…</p>';
}

/** Markdown editörüne toolbar + önizleme bağlar. */
function setupMarkdownField(name){
  const ta = $(`f_${name}`);
  const toolbar = $(`f_${name}_toolbar`);
  const preview = $(`f_${name}_preview`);
  if (!ta || !toolbar) return;

  function wrapSelection(before, after = before){
    const start = ta.selectionStart, end = ta.selectionEnd;
    const sel = ta.value.slice(start, end) || 'metin';
    ta.value = ta.value.slice(0, start) + before + sel + after + ta.value.slice(end);
    ta.focus();
    ta.selectionStart = start + before.length;
    ta.selectionEnd = start + before.length + sel.length;
  }

  function insertLinePrefix(prefix){
    const start = ta.selectionStart;
    const lineStart = ta.value.lastIndexOf('\n', start - 1) + 1;
    ta.value = ta.value.slice(0, lineStart) + prefix + ta.value.slice(lineStart);
    ta.focus();
    ta.selectionStart = ta.selectionEnd = start + prefix.length;
  }

  toolbar.querySelectorAll('[data-cmd]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cmd = btn.dataset.cmd;
      if (cmd === 'bold') wrapSelection('**');
      else if (cmd === 'italic') wrapSelection('*');
      else if (cmd === 'h2') insertLinePrefix('## ');
      else if (cmd === 'h3') insertLinePrefix('### ');
      else if (cmd === 'ul') insertLinePrefix('- ');
      else if (cmd === 'ol') insertLinePrefix('1. ');
      else if (cmd === 'link') {
        const url = prompt('Bağlantı adresi (https://…):');
        if (url) wrapSelection('[', `](${url})`);
      } else if (cmd === 'preview') {
        const on = preview.classList.toggle('active');
        ta.parentElement.querySelector('.md-editor-area').hidden = on;
        btn.classList.toggle('active', on);
        btn.textContent = on ? '✏️ Düzenle' : '👁 Önizleme';
        if (on) preview.innerHTML = mdToHtml(ta.value);
      }
    });
  });
}

function renderGalleryThumbs(name){
  const box = $(`f_${name}_thumbs`);
  if (!box) return;
  const existingHtml = galleryState.existing.map((path, i) => `
    <div class="gallery-thumb">
      <img src="https://ar-kar.com${esc(path)}" alt="" onerror="this.closest('.gallery-thumb').style.display='none'" />
      <button type="button" data-remove-existing="${i}" title="Kaldır">✕</button>
    </div>`).join('');
  const newHtml = galleryState.newFiles.map((f, i) => `
    <div class="gallery-thumb is-new">
      <img src="${f.base64}" alt="" />
      <button type="button" data-remove-new="${i}" title="Kaldır">✕</button>
    </div>`).join('');
  box.innerHTML = existingHtml + newHtml;

  box.querySelectorAll('[data-remove-existing]').forEach(b => {
    b.onclick = () => {
      galleryState.existing.splice(Number(b.dataset.removeExisting), 1);
      renderGalleryThumbs(name);
    };
  });
  box.querySelectorAll('[data-remove-new]').forEach(b => {
    b.onclick = () => {
      galleryState.newFiles.splice(Number(b.dataset.removeNew), 1);
      renderGalleryThumbs(name);
    };
  });
}

function setupGalleryField(name){
  const fileEl = $(`f_${name}_file`);
  if (!fileEl) return;
  fileEl.onchange = async () => {
    const files = Array.from(fileEl.files || []);
    fileEl.value = '';
    const remainingSlots = 8 - galleryState.existing.length - galleryState.newFiles.length;
    if (files.length > remainingSlots) {
      showMsg(`En fazla ${remainingSlots} görsel daha ekleyebilirsiniz (toplam sınır: 8).`, 'err');
    }
    const info = $(`f_${name}_info`);
    for (const file of files.slice(0, Math.max(0, remainingSlots))) {
      info.textContent = `${file.name} WebP'ye çevriliyor…`;
      try {
        const out = await toWebp(file);
        galleryState.newFiles.push({ base64: out.dataUrl, name: file.name });
      } catch (err) {
        showMsg(`${file.name}: ${err.message}`, 'err');
      }
    }
    info.textContent = 'Görseller otomatik WebP\'ye çevrilir. En fazla 8 görsel.';
    renderGalleryThumbs(name);
  };
}

function renderTabs(){
  $('tabs').innerHTML = keys.map(k =>
    `<button class="tab" role="tab" data-key="${k}" aria-selected="${k===current}">${COLLECTIONS[k].label}</button>`
  ).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => {
    b.onclick = () => { current = b.dataset.key; editingSlug = null; pendingImage = null; renderFields(); loadEntries(); };
  });
}

function renderFields(values){
  values = values || {};
  pendingImage = null;
  galleryState = { existing: Array.isArray(values.gallery) ? [...values.gallery] : [], newFiles: [] };

  $('fields').innerHTML = COLLECTIONS[current].fields.map(f => {
    const v = values[f.name] != null ? String(values[f.name]) : (f.type === 'date' ? today() : '');
    const req = f.required ? 'required' : '';
    let input;
    if (f.type === 'textarea') {
      input = `<textarea id="f_${f.name}" rows="3" ${req}>${esc(v)}</textarea>`;
    } else if (f.type === 'markdown') {
      input = `
        <div class="md-toolbar" id="f_${f.name}_toolbar">
          <button type="button" data-cmd="h2" title="Alt Başlık">H2</button>
          <button type="button" data-cmd="h3" title="Alt Başlık">H3</button>
          <span class="sep"></span>
          <button type="button" data-cmd="bold" title="Kalın"><strong>K</strong></button>
          <button type="button" data-cmd="italic" title="İtalik"><em>İ</em></button>
          <span class="sep"></span>
          <button type="button" data-cmd="ul" title="Madde Listesi">• Liste</button>
          <button type="button" data-cmd="ol" title="Numaralı Liste">1. Liste</button>
          <button type="button" data-cmd="link" title="Bağlantı">🔗 Link</button>
          <button type="button" data-cmd="preview" class="push" title="Önizleme">👁 Önizleme</button>
        </div>
        <div class="md-editor-area">
          <textarea id="f_${f.name}" rows="12" ${req}>${esc(v)}</textarea>
        </div>
        <div class="md-preview" id="f_${f.name}_preview"></div>`;
    } else if (f.type === 'select') {
      input = `<select id="f_${f.name}" ${req}>` +
        f.options.map(o => `<option value="${esc(o.value)}" ${o.value===v?'selected':''}>${esc(o.label)}</option>`).join('') + `</select>`;
    } else if (f.type === 'image') {
      input = `<input type="file" id="f_${f.name}_file" accept="image/*" />
       <input type="hidden" id="f_${f.name}" value="${esc(v)}" />
       <div id="f_${f.name}_info" class="hint">Yüklediğiniz görsel otomatik WebP'ye çevrilir. Boş bırakırsanız mevcut görsel korunur.</div>
       ${v ? `<img class="preview" src="https://ar-kar.com${esc(v)}" alt="" onerror="this.style.display='none'" />` : ''}`;
    } else if (f.type === 'gallery') {
      input = `<input type="file" id="f_${f.name}_file" accept="image/*" multiple />
       <div id="f_${f.name}_info" class="hint">Görseller otomatik WebP'ye çevrilir. En fazla 8 görsel.</div>
       <div class="gallery-thumbs" id="f_${f.name}_thumbs"></div>`;
    } else if (f.type === 'date') {
      input = `<input type="date" id="f_${f.name}" value="${esc(v)}" ${req} />`;
    } else {
      input = `<input type="text" id="f_${f.name}" value="${esc(v)}" placeholder="${esc(f.placeholder||'')}" ${req} />`;
    }
    return `<div class="field"><label for="f_${f.name}">${f.label}${f.required?' *':''}</label>${input}</div>`;
  }).join('');

  $('formTitle').textContent = editingSlug ? `Düzenleniyor: ${editingSlug}` : 'Yeni Kayıt';

  const fileEl = $('f_coverImage_file');
  if (fileEl) {
    fileEl.onchange = async () => {
      const file = fileEl.files && fileEl.files[0];
      if (!file) { pendingImage = null; return; }
      const info = $('f_coverImage_info');
      info.textContent = 'WebP formatına çevriliyor…';
      try {
        const out = await toWebp(file);
        pendingImage = { base64: out.dataUrl, name: file.name };
        info.textContent = `Hazır: ${out.width}×${out.height}px, ${(out.size/1024).toFixed(0)} KB (WebP)`;
      } catch (err) {
        pendingImage = null;
        info.textContent = 'Hata: ' + err.message;
      }
    };
  }

  for (const f of COLLECTIONS[current].fields) {
    if (f.type === 'markdown') setupMarkdownField(f.name);
    if (f.type === 'gallery') { setupGalleryField(f.name); renderGalleryThumbs(f.name); }
  }
}

async function loadEntries(){
  $('entries').innerHTML = '';
  $('listEmpty').textContent = 'Yükleniyor…';
  $('listEmpty').style.display = 'block';
  $('listTitle').textContent = COLLECTIONS[current].label;
  try{
    const res = await fetch(`/api/entries?collection=${current}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Liste alınamadı');
    if (!data.entries.length){ $('listEmpty').textContent = 'Henüz kayıt yok.'; return; }
    $('listEmpty').style.display = 'none';
    $('entries').innerHTML = data.entries.map(e => `
      <li>
        <div class="entry-main">
          <div class="entry-title">${esc(e.title)}</div>
          <div class="entry-meta">${esc(e.date)} · ${esc(e.slug)}</div>
        </div>
        <button class="ghost"  data-edit="${esc(e.slug)}">Düzenle</button>
        <button class="danger" data-del="${esc(e.slug)}">Sil</button>
      </li>`).join('');
    $('entries').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editEntry(b.dataset.edit));
    $('entries').querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteEntry(b.dataset.del));
  }catch(err){
    $('listEmpty').textContent = 'Hata: ' + err.message;
  }
}

async function editEntry(slug){
  try{
    const res = await fetch(`/api/entries?collection=${current}&slug=${encodeURIComponent(slug)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Kayıt alınamadı');
    editingSlug = slug;
    renderFields({ ...data.data, gallery: data.gallery || [], content: data.body });
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }catch(err){ showMsg(err.message, 'err'); }
}

async function deleteEntry(slug){
  if (!confirm(`"${slug}" kaydı silinecek. Emin misiniz?`)) return;
  try{
    const res = await fetch(`/api/entries?collection=${current}&slug=${encodeURIComponent(slug)}`, { method:'DELETE' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Silinemedi');
    showMsg('Kayıt silindi. Site birkaç dakika içinde güncellenecek.', 'ok');
    if (editingSlug === slug){ editingSlug = null; renderFields(); }
    loadEntries();
  }catch(err){ showMsg(err.message, 'err'); }
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('saveBtn');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Kaydediliyor…';
  try{
    const payload = { collection: current };
    if (editingSlug) payload.slug = editingSlug;
    for (const f of COLLECTIONS[current].fields){
      if (f.type === 'gallery') continue;
      const el = $(`f_${f.name}`);
      if (el) payload[f.name] = el.value;
    }
    if (pendingImage){
      payload.imageBase64 = pendingImage.base64;
      payload.imageName   = pendingImage.name;
    }
    if (COLLECTIONS[current].fields.some(f => f.type === 'gallery')) {
      payload.existingGallery = galleryState.existing;
      payload.galleryImages = galleryState.newFiles;
    }
    const res = await fetch('/api/publish', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Kaydedilemedi');
    showMsg('Yayınlandı. Testler geçtikten sonra site güncellenecek (1-2 dk).', 'ok');
    editingSlug = null;
    renderFields();
    loadEntries();
  }catch(err){
    showMsg(err.message, 'err');
  }finally{
    btn.disabled = false; btn.textContent = label;
  }
});

$('resetBtn').onclick = () => { editingSlug = null; renderFields(); };

function renderAll(){ renderTabs(); renderFields(); loadEntries(); }

// Access kimliğini göster (Cloudflare bu uç noktayı otomatik sağlar)
fetch('/cdn-cgi/access/get-identity')
  .then(r => r.ok ? r.json() : null)
  .then(id => { if (id && id.email) $('who').textContent = id.email; })
  .catch(() => {});

renderAll();
</script>
</body>
</html>
